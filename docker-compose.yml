services:
  postgres:
    image: postgres:16-alpine
    container_name: elitedev-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-elitedev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-elitedev}
      POSTGRES_DB: ${POSTGRES_DB:-elitedev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-elitedev} -d ${POSTGRES_DB:-elitedev}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: elitedev-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3001}:3001"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-elitedev}:${POSTGRES_PASSWORD:-elitedev}@postgres:5432/${POSTGRES_DB:-elitedev}
      API_PORT: 3001
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-local-dev}
      TICKET_HMAC_SECRET: ${TICKET_HMAC_SECRET:-change-me-ticket-hmac}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    container_name: elitedev-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      - api

volumes:
  postgres_data:
